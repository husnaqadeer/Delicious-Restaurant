<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Delicious Restaurant</title>
    <link rel="stylesheet" href="restaurant-landing-page.css">
</head>

<body>

    <!-- Header -->

    <header>
        <h1>🍽 Delicious Restaurant</h1>
        <p>Welcome Back!</p>
    </header>

    <!-- Login Section -->

    <main>

        <section id="login">

            <h2>Login to Your Account</h2>

            <form>

                <fieldset>

                    <legend>Login Information</legend>

                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Enter your email"
                        required
                    >

                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password"
                        required
                    >

                    <div class="form-buttons">

                        <input type="submit" value="Login">

                        <input type="reset" value="Clear">

                    </div>

                </fieldset>

            </form>

        </section>

    </main>

    <!-- Footer -->

    <footer>

        <p><strong>Delicious Restaurant</strong></p>

        <p>📍 Kabul, Afghanistan</p>

        <p>📞 +93 700 123 456</p>

        <p>✉ deliciousrestaurant@email.com</p>

        <p>&copy; 2026 Delicious Restaurant. All Rights Reserved.</p>

    </footer>

</body>

</html>
